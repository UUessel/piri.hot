  pt: { survived: 'A tua boca sobreviveu', tried: 'pimentos experimentados', logged: 'burns registado', countries: 'países queimados', piris: "Piri's · 6 de 14", hottest: 'O mais quente até agora', board: 'no quadro', full: 'Full desbloquear' },
  it: { survived: 'La tua bocca ce l’ha fatta', tried: 'peperoni provati', logged: 'burns registrato', countries: 'paesi bruciati', piris: "Piri's · 6 di 14", hottest: 'Il più caldo finora', board: 'in campo', full: 'Full sblocca' },
};
const LOCALE = { en: 'en-GB', nl: 'nl-NL', de: 'de-DE', fr: 'fr-FR', es: 'es-ES', th: 'th-TH', pt: 'pt-PT', it: 'it-IT' };

// ---- drawings ----
const STAGES = [
  { th: [0, 99],              spec: { mood: 'happy', scale: 0.5, baby: true, body: '#7DAA68' } },
  { th: [100, 9999],          spec: { mood: 'happy', body: '#B9C24A' } },
  { th: [10000, 99999],       spec: { mood: 'happy', glyph: 'sweat', body: '#E9C64A' } },
  { th: [100000, 999999],     spec: { mood: 'cool', body: '#EDAB42' } },
  { th: [1000000, 9999999],   spec: { mood: 'smoked', glyph: 'smoke', body: '#F0953A' } },
  { th: [10000000, null],     spec: { mood: 'roar', scale: 0.52, glyph2: 'dragoncrown', body: '#E43D28' } },
];
const piri = (i, size, name) => medal({ name, fill: 'none', bare: true, ...STAGES[i].spec }, size, true);
const SHOW = ['first_pepper', 'ten_peppers', 'hot_100k', 'superhot_club', 'brave_raw', 'world_tour', 'board_leader', 'tears_of_joy'];
const ink = '#1E1410';
const appleIcon = `<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.6-1-2.6-3.8zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.2-.6 2.8-1.4z"/></svg>`;
const playIcon = `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 3.5v17l9-8.5z" fill="#34A853"/><path d="M4 3.5l9 8.5 3-2.8L5.5 3z" fill="#4285F4"/><path d="M4 20.5l9-8.5 3 2.8L5.5 21z" fill="#EA4335"/><path d="M16 9.2l3.5 2c.7.4.7 1.2 0 1.6l-3.5 2-3-2.8z" fill="#FBBC04"/></svg>`;
const stores = (t) => `
  <a class="store" href="#" title="placeholder: https://apps.apple.com/app/id0000000000">${appleIcon}<span class="txt"><span class="small">${t.ios_small}</span><span class="big">App Store</span></span><span class="soon">${t.soon}</span></a>
  <a class="store" href="#" title="placeholder: https://play.google.com/store/apps/details?id=app.mouthonfire.mobile">${playIcon}<span class="txt"><span class="small">${t.and_small}</span><span class="big">Google Play</span></span><span class="soon">${t.soon}</span></a>`;
const icons = {
  group: `<svg width="26" height="26" viewBox="0 0 24 24"><circle cx="9" cy="9" r="4" fill="#fff" stroke="${ink}" stroke-width="2"/><circle cx="17" cy="10" r="3" fill="#fff" stroke="${ink}" stroke-width="2"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 15c3 0 6 1.5 6 5" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round"/></svg>`,
  photo: `<svg width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3" fill="#fff" stroke="${ink}" stroke-width="2"/><path d="M8 7l1.5-3h5L16 7" fill="none" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.5" fill="#E43D28" stroke="${ink}" stroke-width="2"/></svg>`,
  board: `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M6 20V10h4v10zM14 20V4h4v16z" fill="#fff" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/><path d="M3 20h18" stroke="${ink}" stroke-width="2" stroke-linecap="round"/></svg>`,
  map: `<svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#8CC3E8" stroke="${ink}" stroke-width="2"/><path d="M6 9c2-3 6-2 6 1s-4 3-3 6M14 6c3 1 4 4 2 6" fill="none" stroke="#FBF5EC" stroke-width="2.5" stroke-linecap="round"/></svg>`,
};

function render(lang) {
  const t = T[lang], loc = LOCALE[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.getElementById('stores-top').innerHTML = stores(t);
  document.getElementById('stores-bottom').innerHTML = stores(t);
  // stages with the heat labels of this language
  const fmt = (n) => n.toLocaleString(loc);
  const th = ([a, b]) => b === null ? `≥ ${fmt(a)}` : a === 0 ? `< ${fmt(b + 1)}` : `${fmt(a)} – ${fmt(b)}`;
  document.getElementById('stages').innerHTML = STAGES.map((s, i) => `<div class="stage-tile">${piri(i, 96, HEAT[lang][i])}<div class="nm">${HEAT[lang][i]}</div><div class="th">${th(s.th)}</div></div>`).join('');
  // example Piri's with their names in this language
  document.getElementById('piris').innerHTML = SHOW.map((code) => { const b = BADGES.find((x) => x.code === code); const [nm, ds] = BADGE_TEXT[lang][code]; return `<div class="piri-tile">${medal({ ...b, name: nm }, 104, true)}<div class="nm">${nm}</div><div class="ds">${ds}</div></div>`; }).join('');
  // the phone: a small Home screen in the app's own words
  const a = APP[lang], cur = 4;
  const hero = STAGES.map((s, i) => i === cur ? `<div>${piri(i, 84, HEAT[lang][i])}<span class="stage">${HEAT[lang][i]}</span></div>` : `<div class="small" style="transform: translateY(-${Math.max(0, 22 - 6 * Math.abs(i - cur))}px)">${piri(i, 22, HEAT[lang][i])}</div>`).join('');
  const earned = ['first_pepper', 'hot_100k', 'superhot_club', 'million_total', 'brave_raw', 'tears_of_joy'];
  document.getElementById('phone').innerHTML = `
    <div class="top"><span class="brand">Mouth on Fire</span><span class="chip">${a.full}</span></div>
    <div class="card shadow phero">
      <div class="head"><div class="label">${a.survived}</div><div class="rank"><span class="n">#23</span> ${a.board} ›</div></div>
      <div class="num total">${fmt(5261313)}</div>
      <div style="font-family:var(--display);font-weight:700;font-size:16px">Scoville</div>
      <div class="bottom"><div></div><div class="piris">${hero}</div></div>
    </div>
    <div class="stats">
      <div class="card stat"><div class="num">8</div><div class="lab">${a.tried}</div></div>
      <div class="card stat"><div class="num">8</div><div class="lab">${a.logged}</div></div>
      <div class="card stat"><div class="num">6</div><div class="lab">${a.countries}</div></div>
    </div>
    <div class="card" style="padding:8px 10px"><div class="label" style="margin-bottom:6px">${a.piris}</div><div class="brow">${BADGES.filter((b) => earned.includes(b.code)).map((b) => medal(b, 34, true)).join('')}</div></div>
    <div class="hottest"><div class="thumb"></div><div><div class="lab">${a.hottest}</div><div class="name">Dragon's Breath</div><div style="font-weight:700;font-size:12px">${fmt(2480000)} SHU · ${HEAT[lang][5]}</div></div></div>`;
  try { localStorage.setItem('piri-lang', lang); } catch {}
}

// language switch: hash (#nl), then remembered, then the browser, then English
const sel = document.getElementById('lang');
sel.innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
let start = location.hash.slice(1);
if (!T[start]) { try { start = localStorage.getItem('piri-lang'); } catch {} }
if (!T[start]) start = (navigator.language || 'en').slice(0, 2);
if (!T[start]) start = 'en';
sel.value = start;
sel.addEventListener('change', () => { location.hash = sel.value; render(sel.value); });
document.getElementById('logo-piri').innerHTML = piri(5, 30, 'Piri');
document.getElementById('hero-piri').innerHTML = piri(5, 300, 'Piri');
document.getElementById('cta-piri').innerHTML = piri(4, 150, 'Piri');
for (const [k, v] of Object.entries(icons)) document.getElementById('ico-' + k).innerHTML = v;
render(start);
</script>
</body>
</html>
