    it: {"site.and_small":"Disponibile su","site.brand_sub":"Il registro Scoville","site.c1_h":"Gruppi","site.c1_p":"Invita gli amici con un codice o un QR code. Guarda i loro burn nel feed e litigate per la classifica del gruppo.","site.c2_h":"Foto prova","site.c2_p":"Fotografa il peperoncino prima che ti prenda. Il tuo gruppo la vede, nessun altro.","site.c3_h":"Classifica della community","site.c3_p":"Le bocche più calde del pianeta, in ordine di totale. Entra quando osi, esci quando piangi.","site.c4_h":"Paesi bruciati","site.c4_p":"Una mappa di ogni paese da cui vengono i tuoi peperoncini, con bandiere e date.","site.cta_h":"Pronto a pentirti di qualcosa?","site.cta_p":"Piri ti aspetta. Porta del latte.","site.f_contact":"Contatti","site.f_made":"Fatto nei Paesi Bassi, con troppi peperoncini.","site.f_privacy":"Privacy","site.hero_h":"Mangia il peperoncino. Registra il burn. Pentiti con stile.","site.hero_p":"Mouth on Fire tiene il conto di ogni peperoncino piccante che mangi, in Scoville. Piri il peperoncino cresce con il tuo totale. I tuoi amici vedono i tuoi burn. La tua bocca non dimentica mai.","site.how_h":"Come funziona","site.ios_small":"Scarica su","site.nav_lang":"Lingua","site.piris_h":"Guadagna Piri","site.piris_p":"{piris} Piri's per traguardi, coraggio e cattive decisioni.","site.placeholder_note":"I link agli store arrivano quando l'app sarà pubblicata.","site.social_h":"Bruciare insieme","site.soon":"Presto","site.stages_h":"Piri cresce con te","site.stages_p":"{stages} fasi, dal primo dolce nulla al ruggito del drago. Piri matura dal verde al rosso mentre il tuo totale sale.","site.step1_h":"Scegli il tuo peperoncino","site.step1_p":"{peppers} peperoncini, dal Padrón al Pepper X, con nomi in {name_languages} lingue. Non sai quale hai mangiato? La procedura guidata chiede colore, forma e dimensione.","site.step2_h":"Registra il burn","site.step2_p":"Intero, in un piatto o al grammo. Valuta il dolore con cinque piccoli Piri e aggiungi una nota che solo tu puoi leggere.","site.step3_h":"Guarda salire il tuo totale","site.step3_p":"Ogni peperoncino conta una volta, con il tuo burn migliore. Il totale Scoville della tua bocca cresce, e Piri cresce con lui."},
    nl: {"site.and_small":"Ontdek het op","site.brand_sub":"Het Scoville-logboek","site.c1_h":"Groepen","site.c1_p":"Nodig vrienden uit met een code of een QR-code. Zie hun burns in de feed en vecht om de scorekaart.","site.c2_h":"Bewijsfoto's","site.c2_p":"Fotografeer de peper voordat hij jou te pakken heeft. Je groep ziet hem, niemand anders.","site.c3_h":"Community-bord","site.c3_p":"De heetste monden op aarde, gerangschikt op totaal. Doe mee als je durft, stap uit als je huilt.","site.c4_h":"Landen verbrand","site.c4_p":"Een kaart van elk land waar je pepers vandaan kwamen, met vlaggen en datums.","site.cta_h":"Klaar om ergens spijt van te krijgen?","site.cta_p":"Piri wacht. Neem melk mee.","site.f_contact":"Contact","site.f_made":"Gemaakt in Nederland, met te veel pepers.","site.f_privacy":"Privacybeleid","site.hero_h":"Eet de peper. Log de burn. Heb er stijlvol spijt van.","site.hero_p":"Mouth on Fire houdt de score bij van elke hete peper die je eet, in Scoville. Piri de peper groeit met je totaal. Je vrienden zien je burns. Je mond vergeet het nooit.","site.how_h":"Zo werkt het","site.ios_small":"Download in de","site.nav_lang":"Taal","site.piris_h":"Verdien Piri's","site.piris_p":"{piris} Piri's voor mijlpalen, moed en slechte beslissingen.","site.placeholder_note":"De winkellinks volgen zodra de app in de winkels staat.","site.social_h":"Samen branden","site.soon":"Binnenkort","site.stages_h":"Piri groeit met je mee","site.stages_p":"{stages} stadia, van je eerste zoete niks tot een volle drakenbrul. Piri rijpt van groen naar rood terwijl je totaal stijgt.","site.step1_h":"Kies je peper","site.step1_p":"{peppers} pepers, van Padrón tot Pepper X, met namen in {name_languages} talen. Weet je niet welke je at? De wizard vraagt naar kleur, vorm en grootte.","site.step2_h":"Log de burn","site.step2_p":"Heel, in een gerecht of per gram. Beoordeel de pijn met vijf kleine Piri's en schrijf een notitie die alleen jij kunt lezen.","site.step3_h":"Zie je totaal stijgen","site.step3_p":"Elke peper telt één keer, met je beste burn. Het Scoville-totaal van je mond groeit en Piri groeit mee."},
    pt: {"site.and_small":"Disponível no","site.brand_sub":"O registo Scoville","site.c1_h":"Grupos","site.c1_p":"Convida amigos com um código ou um código QR. Vê os burns deles no feed e luta pela tabela de classificação.","site.c2_h":"Fotos de prova","site.c2_p":"Fotografa a malagueta antes que ela te apanhe. O teu grupo vê, mais ninguém.","site.c3_h":"Quadro da comunidade","site.c3_p":"As bocas mais quentes do planeta, ordenadas por total. Entra quando te atreveres, sai quando chorares.","site.c4_h":"Países queimados","site.c4_p":"Um mapa de todos os países de onde vieram as tuas malaguetas, com bandeiras e datas.","site.cta_h":"Pronto para te arrependeres de algo?","site.cta_p":"O Piri está à espera. Traz leite.","site.f_contact":"Contacto","site.f_made":"Feito nos Países Baixos, com malaguetas a mais.","site.f_privacy":"Privacidade","site.hero_h":"Come a malagueta. Regista o burn. Arrepende-te com estilo.","site.hero_p":"O Mouth on Fire conta cada malagueta picante que comes, em Scoville. O Piri, a malagueta, cresce com o teu total. Os teus amigos veem os teus burns. A tua boca nunca esquece.","site.how_h":"Como funciona","site.ios_small":"Descarregar na","site.nav_lang":"Idioma","site.piris_h":"Ganha Piris","site.piris_p":"{piris} Piri's por marcos, coragem e más decisões.","site.placeholder_note":"As ligações às lojas chegam quando a app estiver publicada.","site.social_h":"Arder juntos","site.soon":"Em breve","site.stages_h":"O Piri cresce contigo","site.stages_p":"{stages} fases, do primeiro nadinha doce ao rugido do dragão. O Piri amadurece de verde a vermelho à medida que o teu total sobe.","site.step1_h":"Escolhe a tua malagueta","site.step1_p":"{peppers} malaguetas, do Padrón ao Pepper X, com nomes em {name_languages} línguas. Não sabes qual comeste? O assistente pergunta a cor, a forma e o tamanho.","site.step2_h":"Regista o burn","site.step2_p":"Inteira, num prato ou ao grama. Avalia a dor com cinco pequenos Piris e junta uma nota que só tu podes ler. <script>
// ---- the words and numbers: live from Supabase, the snapshot in site-texts.js until it answers (and when it does not) ----
// Publishable key: safe to expose, it only reaches what Row Level Security lets everyone read (the same key the app uses).
const SUPABASE_URL = 'https://jgideiwztyorsejitaeo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_s8CtdTJQY4mVKp4qZv6XjQ_1ouUed8z';
const LEVELS = ['none', 'mild', 'medium', 'hot', 'very_hot', 'superhot'];
// the app's own Home words for the phone drawing (ui_strings keys, edited in the admin Texts tab under App texts)
const APP_KEYS = ['home.survived', 'home.stat_peppers_tried', 'home.stat_burns_logged', 'home.stat_countries_burned', 'home.piris_count', 'home.hottest_so_far', 'home.rank_on_board', 'common.full_unlock'];
const LOCALE = { en: 'en-GB', nl: 'nl-NL', de: 'de-DE', fr: 'fr-FR', es: 'es-ES', th: 'th-TH', pt: 'pt-PT', it: 'it-IT' };
let DATA = SITE;

async function api(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!r.ok) throw new Error(`Supabase answered ${r.status} on ${path.split('?')[0]}`);
  return r.json();
}
// everything the page shows, in every language at once (a few hundred rows, under the 1000-row cap of one request),
// so switching the language needs no new request
async function loadLive() {
  const [counts, strings, heat, badges, languages] = await Promise.all([
    api('rpc/site_counts'),
    api(`ui_strings?select=key,language_code,value&or=(key.like.site.*,key.in.(${APP_KEYS.join(',')}))`),
    api('heat_labels?select=level,language_code,label'),
    api('badges?select=code,name,description,sort_order,translations&order=sort_order'),
    api('languages?select=code,native_name,sort_order&is_enabled=is.true&order=sort_order'),
  ]);
  const texts = {}, app = {}, heatBy = {};
  for (const r of strings) ((r.key.startsWith('site.') ? texts : app)[r.language_code] ??= {})[r.key] = r.value;
  for (const r of heat) (heatBy[r.language_code] ??= {})[r.level] = r.label;
  DATA = { texts, app, heat: heatBy, badges, languages, counts: counts[0] };
}
// a word: live in this language, live English, the snapshot in this language, the snapshot's English
const pick = (section, lang, key) => { for (const src of [DATA, SITE]) for (const l of [lang, 'en']) { const v = src[section] && src[section][l] && src[section][l][key]; if (v) return v; } return ''; };
const hasTexts = (lang) => Boolean((DATA.texts[lang] || SITE.texts[lang] || {})['site.hero_h']);
const locale = (lang) => LOCALE[lang] || lang;
const fmt = (n, loc) => Number(n).toLocaleString(loc);
// {peppers}, {name_languages}, {piris}, {stages} and the phone's {earned}/{total} become numbers in the page's language
const fill = (s, loc, extra = {}) => s.replace(/\{(\w+)\}/g, (m, k) => (k in extra ? fmt(extra[k], loc) : k in DATA.counts ? fmt(DATA.counts[k], loc) : m));

// ---- drawings ----
const STAGES = [
  { th: [0, 99],              spec: { mood: 'happy', scale: 0.5, baby: true, body: '#7DAA68' } },
  { th: [100, 9999],          spec: { mood: 'happy', body: '#B9C24A' } },
  { th: [10000, 99999],       spec: { mood: 'happy', glyph: 'sweat', body: '#E9C64A' } },
  { th: [100000, 999999],     spec: { mood: 'cool', body: '#EDAB42' } },
  { th: [1000000, 9999999],   spec: { mood: 'smoked', glyph: 'smoke', body: '#F0953A' } },
  { th: [10000000, null],     spec: { mood: 'roar', scale: 0.52, glyph2: 'dragoncrown', body: '#E43D28' } },
];
const piri = (i, size, name) => medal({ name, fill: 'none', bare: true, ...STAGES[i].spec }, size, true);
const ink = '#1E1410';

const playIcon = `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 3.5v17l9-8.5z" fill="#34A853"/><path d="M4 3.5l9 8.5 3-2.8L5.5 3z" fill="#4285F4"/><path d="M4 20.5l9-8.5 3 2.8L5.5 21z" fill="#EA4335"/><path d="M16 9.2l3.5 2c.7.4.7 1.2 0 1.6l-3.5 2-3-2.8z" fill="#FBBC04"/></svg>`;
const stores = (t) => `
  <a class="store" href="#" title="placeholder: https://apps.apple.com/app/id0000000000">${appleIcon}<span class="txt"><span class="small">${t('ios_small')}</span><span class="big">App Store</span></span><span class="soon">${t('soon')}</span></a>
  <a class="store" href="#" title="placeholder: https://play.google.com/store/apps/details?id=app.mouthonfire.mobile">${playIcon}<span class="txt"><span class="small">${t('and_small')}</span><span class="big">Google Play</span></span><span class="soon">${t('soon')}</span></a>`;
const icons = {
  group: `<svg width="26" height="26" viewBox="0 0 24 24"><circle cx="9" cy="9" r="4" fill="#fff" stroke="${ink}" stroke-width="2"/><circle cx="17" cy="10" r="3" fill="#fff" stroke="${ink}" stroke-width="2"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 15c3 0 6 1.5 6 5" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round"/></svg>`,
  photo: `<svg width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3" fill="#fff" stroke="${ink}" stroke-width="2"/><path d="M8 7l1.5-3h5L16 7" fill="none" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.5" fill="#E43D28" stroke="${ink}" stroke-width="2"/></svg>`,
  board: `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M6 20V10h4v10zM14 20V4h4v16z" fill="#fff" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/><path d="M3 20h18" stroke="${ink}" stroke-width="2" stroke-linecap="round"/></svg>`,
  map: `<svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#8CC3E8" stroke="${ink}" stroke-width="2"/><path d="M6 9c2-3 6-2 6 1s-4 3-3 6M14 6c3 1 4 4 2 6" fill="none" stroke="#FBF5EC" stroke-width="2.5" stroke-linecap="round"/></svg>`,
};

function render(lang) {
  const loc = locale(lang);
  const t = (k, extra) => fill(pick('texts', lang, `site.${k}`), loc, extra);
  const a = (k, extra) => fill(pick('app', lang, k), loc, extra);
  const heat = (i) => pick('heat', lang, LEVELS[i]);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  document.getElementById('stores-top').innerHTML = stores(t);
  document.getElementById('stores-bottom').innerHTML = stores(t);
  // stages with the heat labels of this language (admin Settings tab)
  const fmtN = (n) => fmt(n, loc);
  const th = ([x, y]) => y === null ? `≥ ${fmtN(x)}` : x === 0 ? `< ${fmtN(y + 1)}` : `${fmtN(x)} – ${fmtN(y)}`;
  document.getElementById('stages').innerHTML = STAGES.map((s, i) => `<div class="stage-tile">${piri(i, 96, heat(i))}<div class="nm">${heat(i)}</div><div class="th">${th(s.th)}</div></div>`).join('');
  // every Piri that has a drawing, with its name and description in this language (admin Piri's tab)
  const tiles = [...DATA.badges].sort((x, y) => x.sort_order - y.sort_order).map((b) => ({ b, d: BADGES.find((x) => x.code === b.code) })).filter((x) => x.d);
  document.getElementById('piris').innerHTML = tiles.map(({ b, d }) => {
    const tr = (b.translations && b.translations[lang]) || {};
    const nm = tr.name || b.name || d.name, ds = tr.description || b.description || d.desc;
    return `<div class="piri-tile">${medal({ ...d, name: nm }, 104, true)}<div class="nm">${nm}</div><div class="ds">${ds}</div></div>`;
  }).join('');
  // the phone: one person's Home screen in the app's own words; the numbers on it are an illustration
  const cur = 4;
  const hero = STAGES.map((s, i) => i === cur ? `<div>${piri(i, 84, heat(i))}<span class="stage">${heat(i)}</span></div>` : `<div class="small" style="transform: translateY(-${Math.max(0, 22 - 6 * Math.abs(i - cur))}px)">${piri(i, 22, heat(i))}</div>`).join('');
  const earned = ['first_pepper', 'hot_100k', 'superhot_club', 'million_total', 'brave_raw', 'tears_of_joy'];
  document.getElementById('phone').innerHTML = `
    <div class="top"><span class="brand">Mouth on Fire</span><span class="chip">${a('common.full_unlock')}</span></div>
    <div class="card shadow phero">
      <div class="head"><div class="label">${a('home.survived')}</div><div class="rank"><span class="n">#23</span> ${a('home.rank_on_board')} ›</div></div>
      <div class="num total">${fmtN(5261313)}</div>
      <div style="font-family:var(--display);font-weight:700;font-size:16px">Scoville</div>
      <div class="bottom"><div></div><div class="piris">${hero}</div></div>
    </div>
    <div class="stats">
      <div class="card stat"><div class="num">8</div><div class="lab">${a('home.stat_peppers_tried')}</div></div>
      <div class="card stat"><div class="num">8</div><div class="lab">${a('home.stat_burns_logged')}</div></div>
      <div class="card stat"><div class="num">6</div><div class="lab">${a('home.stat_countries_burned')}</div></div>
    </div>
    <div class="card" style="padding:8px 10px"><div class="label" style="margin-bottom:6px">${a('home.piris_count', { earned: earned.length, total: DATA.counts.piris })}</div><div class="brow">${BADGES.filter((b) => earned.includes(b.code)).map((b) => medal(b, 34, true)).join('')}</div></div>
    <div class="hottest"><div class="thumb"></div><div><div class="lab">${a('home.hottest_so_far')}</div><div class="name">Dragon's Breath</div><div style="font-weight:700;font-size:12px">${fmtN(2480000)} SHU · ${heat(5)}</div></div></div>`;
  try { localStorage.setItem('piri-lang', lang); } catch {}
}

// language switch: the languages switched on in the admin that have website texts; hash (#nl), then remembered, then the browser, then English
const sel = document.getElementById('lang');
const has = (code) => [...sel.options].some((o) => o.value === code);
function languageOptions() {
  const list = (DATA.languages || SITE.languages).filter((l) => hasTexts(l.code));
  sel.innerHTML = list.map((l) => `<option value="${l.code}">${l.native_name}</option>`).join('');
}
function startLanguage() {
  let s = location.hash.slice(1);
  if (!has(s)) { try { s = localStorage.getItem('piri-lang'); } catch {} }
  if (!has(s)) s = (navigator.language || 'en').slice(0, 2);
  return has(s) ? s : 'en';
}
languageOptions();
let current = startLanguage();
sel.value = current;
sel.addEventListener('change', () => { current = sel.value; location.hash = current; render(current); });
document.getElementById('logo-piri').innerHTML = piri(5, 30, 'Piri');
document.getElementById('hero-piri').innerHTML = piri(5, 300, 'Piri');
document.getElementById('cta-piri').innerHTML = piri(4, 150, 'Piri');
for (const [k, v] of Object.entries(icons)) document.getElementById('ico-' + k).innerHTML = v;
render(current);
// then the live words and numbers; on failure the page keeps the snapshot and says so in the console only
loadLive().then(() => { languageOptions(); if (!has(current)) current = 'en'; sel.value = current; render(current); })
  .catch((e) => console.warn('piri.hot: showing the built-in words and numbers, Supabase did not answer.', e.message));
</script>
