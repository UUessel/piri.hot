// ---- rendering ----
const esc = (s) => String(s).replace(/&(?!(amp|lt|gt|quot|#39);)/g, '&amp;');
function block(b) {
  if (typeof b === 'string') return `<p>${b}</p>`;
  if (b.ul) return `<ul>${b.ul.map((li) => `<li>${li}</li>`).join('')}</ul>`;
  if (b.box) return `<div class="box">${b.box}</div>`;
  if (b.table) {
    const [head, ...rows] = b.table;
    return `<table><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  return '';
}
const section = (s) => `<h2 id="${s.id}">${s.h}</h2>${s.body.map(block).join('')}`;

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.getElementById('doc').innerHTML =
    `<p class="intro">${t.intro}</p>` + t.policy.map(section).join('') +
    `<hr class="divider">` + t.terms.map((s) => `<h2 class="terms-head" id="${s.id}">${s.h}</h2>${s.body.map(block).join('')}`).join('');
  document.getElementById('toc').innerHTML =
    `<div class="label">${t.toc_label}</div><ol>${t.policy.map((s) => `<li><a href="#${s.id}">${s.h.replace(/^\d+\.\s*/, '')}</a></li>`).join('')}</ol>` +
    `<div class="terms"><a href="#terms">${t.toc_terms}</a></div>`;
  try { localStorage.setItem('piri-lang', lang); } catch {}
}

// language switch: hash (#nl), then remembered, then the browser, then English
const sel = document.getElementById('lang');
sel.innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
let start = location.hash.slice(1);
if (!T[start]) { try { start = localStorage.getItem('piri-lang'); } catch {} }
if (!T[start]) start = (navigator.language || 'en').slice(0, 2);
if (!T[start]) start = 'en';
sel.value = start;
sel.addEventListener('change', () => { history.replaceState(null, '', '#' + sel.value); render(sel.value); });
render(start);
</script>
